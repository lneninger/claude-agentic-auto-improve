name: version-bump

on:
  pull_request:

jobs:
  version-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Plugin version is raised when shipped files change
        run: python3 .claude/scripts/check_version_bump.py --base origin/${{ github.base_ref }} --default-branch ${{ github.event.repository.default_branch }} --head-ref ${{ github.head_ref }}
